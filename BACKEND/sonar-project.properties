# Análisis de SonarQube - BACKEND (API Node.js / Express)
sonar.projectKey=cuidarteplus-backend
sonar.projectName=CuidartePlus - Backend (API)
sonar.projectVersion=1.0

# Qué se analiza: el código fuente y el Dockerfile
sonar.sources=src,Dockerfile
sonar.exclusions=**/node_modules/**

sonar.sourceEncoding=UTF-8

# Carpeta temporal del scanner (dentro del contenedor, para no ensuciar tu carpeta)
sonar.working.directory=/tmp/.scannerwork
