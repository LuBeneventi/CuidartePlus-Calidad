# Análisis de SonarQube - FRONTEND (React + Vite)
sonar.projectKey=cuidarteplus-frontend
sonar.projectName=CuidartePlus - Frontend (React)
sonar.projectVersion=1.0

# Qué se analiza: el código fuente, la página base y el Dockerfile
sonar.sources=src,index.html,Dockerfile
sonar.exclusions=**/node_modules/**,**/dist/**,src/assets/**

sonar.sourceEncoding=UTF-8

# Carpeta temporal del scanner (dentro del contenedor, para no ensuciar tu carpeta)
sonar.working.directory=/tmp/.scannerwork
